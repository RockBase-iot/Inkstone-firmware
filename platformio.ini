; ============================================================================
; Inkstone-firmware — local image-push firmware for the NM-EPD e-ink family
;
; Multi-board framework: each [env:<board>] maps to one board; shared settings
; live in [env]. Adding a board = add src/boards/<board>.h + one [env:<board>].
; Board constants (pins / panel / frame format) come from src/boards/*.h only.
; ============================================================================

[platformio]
default_envs = nm-epd-420-4c

; ─── Shared baseline (aligned with RockBase-iot/NM-EPD-420 factory firmware) ─
[env]
platform    = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework   = arduino
board       = lilygo-t-display-s3
monitor_speed = 115200
board_build.flash_mode  = dio
board_build.f_cpu       = 240000000L
board_build.partitions  = partitions_inkstone.csv   ; 64KB NVS for the cached frame
board_build.arduino.memory_type = qio_opi

extra_scripts =
    pre:scripts/gen_embedded_page.py     ; web/uploader.html -> src/net/embedded_page.h
    post:scripts/merge_firmware.py       ; merged 0x0 image inkstone-<env>.bin

build_unflags = -std=gnu++11
build_flags =
    -Wall
    -std=gnu++17
    -Isrc
    -DBOARD_HAS_PSRAM
    ; RETRO byte-parity depends on every float op keeping its exact float32
    ; rounding. GCC defaults to -ffp-contract=fast, which lets it fuse a*b+c
    ; into a single FMA and skip the rounding of the product; Xtensa has FMA
    ; instructions, so this is a real risk, not a theoretical one. The
    ; -ffp-contract=off below is what makes src/display/retro_quantize.cpp
    ; match the Python reference and the browser bit for bit. Do not remove it.
    -ffp-contract=off

lib_deps =
    zinggjm/GxEPD2 @ 1.6.8
    bitbank2/JPEGDEC @ ^1.6.0
    bitbank2/PNGdec @ ^1.0.1
    bblanchon/ArduinoJson @ ^7.4.2

; ─── NM-EPD-420-4C: ESP32-S3 + 4.2" 400x300 4-color GDEY0420F51 (HX8717) ────
[env:nm-epd-420-4c]
build_flags =
    ${env.build_flags}
    -DBOARD_NM_EPD_420_4C=1

